name: Merge All TXT Files

on:
  push:
    branches: [ "main" ]   # Se seu branch for master, altere aqui
  workflow_dispatch:

# Adicione estas permissões, caso contrário o Token não terá permissão de push
permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Especifique o branch explicitamente para evitar detached HEAD
          ref: main
          # Mantenha as credenciais para que o push posterior tenha autenticação
          persist-credentials: true

      - name: Merge all .txt files into all_in_one.txt
        run: |
          find . -type f -name '*.txt' ! -name 'all_in_one.txt' -exec cat {} + > all_in_one.txt

      - name: Commit and push merged file
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add all_in_one.txt
          git diff --staged --quiet || git commit -m "Auto merge all TXT files"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
